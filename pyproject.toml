[project]
name = "discogs"
version = "0.3.0"
description = "Discogs collection sync and recommendation framework"
requires-python = ">=3.11"
dependencies = [
    # The name-matching rules, the shared ~/.music path and the export
    # envelope, extracted from the repos that were keeping copies of them
    # identical by hand. Pinned to a tag: a change to normalisation is a
    # change to which release matches which, and it should arrive
    # deliberately.
    "media-core @ git+https://github.com/gr8monk3ys/media-core@v0.1.1",
    "python3-discogs-client>=2.7",
    "click>=8.1",
    "rich>=13.0",
    "pydantic>=2.5",
    "anthropic>=0.40",
]

[project.scripts]
discogs = "discogs.cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "vcrpy>=5.1",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
