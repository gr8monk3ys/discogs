name: CI

# `push: [main]` is deliberate: this repo is PUBLIC (since 2026-05-08), so its
# Actions minutes are unlimited and the private-repo minute diet (#5) does not
# apply. Without it the default branch never gets a fresh run and the last
# status shown for `main` stays whatever it was when a PR last merged.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      # media-core is a private repo (git dependency in pyproject.toml/uv.lock). uv fetches it with the
      # system git, which reads it over SSH using a read-only deploy key on gr8monk3ys/media-core,
      # stored here as the MEDIA_CORE_DEPLOY_KEY secret (also set for Dependabot). Fork PRs don't get
      # the secret, so their install step will fail.
      - name: Authenticate the private media-core dependency
        env:
          MEDIA_CORE_DEPLOY_KEY: ${{ secrets.MEDIA_CORE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MEDIA_CORE_DEPLOY_KEY" > ~/.ssh/media_core
          chmod 600 ~/.ssh/media_core
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/media_core -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gr8monk3ys/media-core".insteadOf "https://github.com/gr8monk3ys/media-core"

      - name: Install dependencies
        run: uv sync --locked

      # Mirrors the locally-enforced gates exactly. `ruff format` is intentionally
      # not run: this project adopted `ruff check` (lint) but not the formatter.
      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy src

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # media-core is a private repo (git dependency in pyproject.toml/uv.lock). uv fetches it with the
      # system git, which reads it over SSH using a read-only deploy key on gr8monk3ys/media-core,
      # stored here as the MEDIA_CORE_DEPLOY_KEY secret (also set for Dependabot). Fork PRs don't get
      # the secret, so their install step will fail.
      - name: Authenticate the private media-core dependency
        env:
          MEDIA_CORE_DEPLOY_KEY: ${{ secrets.MEDIA_CORE_DEPLOY_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$MEDIA_CORE_DEPLOY_KEY" > ~/.ssh/media_core
          chmod 600 ~/.ssh/media_core
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          git config --global core.sshCommand "ssh -i ~/.ssh/media_core -o IdentitiesOnly=yes"
          git config --global url."git@github.com:gr8monk3ys/media-core".insteadOf "https://github.com/gr8monk3ys/media-core"

      - name: Install dependencies
        run: uv sync --locked

      # Coverage floor is set just below the current ~93% so an ordinary refactor
      # doesn't redden CI. Ratchet it upward as coverage grows.
      - name: Pytest + coverage gate
        run: >-
          uv run pytest
          --cov=discogs
          --cov-report=term-missing
          --cov-fail-under=90
